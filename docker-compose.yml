services:
  pinchflat:
    container_name: pinchflat-swarm
    image: ghcr.io/kieraneglin/pinchflat:latest
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Chicago
    security_opt:
    - no-new-privileges:false
    - seccomp:unconfined
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/8945' || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    volumes:
    - pinchflat-swarm:/config:rw
    ports:
    - target: 8945
      published: 8945
      protocol: tcp
      mode: host
    deploy:
      placement:
        constraints:
        - node.role==manager
      restart_policy:
        condition: on-failure
volumes:
  pinchflat-swarm:
    name: pinchflat-swarm
